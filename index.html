<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hallow — Ultimate Gaming & Web Hub</title>
    <style>
        :root {
            --bg-color: #050507;
            --panel-bg: rgba(12, 12, 18, 0.85);
            --border-color: rgba(138, 43, 226, 0.3);
            --primary-glow: rgba(138, 43, 226, 0.6);
            --accent-purple: #8a2be2;
            --accent-pink: #ff007f;
            --text-main: #f0f0f5;
            --text-muted: #8b8b9e;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            overflow-x: hidden;
            position: relative;
        }

        #particle-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: -1;
            pointer-events: none;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1.2rem 3rem;
            background: rgba(5, 5, 7, 0.9);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--border-color);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .logo {
            font-size: 1.8rem;
            font-weight: 800;
            letter-spacing: 2px;
            background: linear-gradient(135deg, #fff, var(--accent-purple), var(--accent-pink));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 20px var(--primary-glow);
            cursor: pointer;
        }

        nav {
            display: flex;
            gap: 1.5rem;
        }

        .nav-btn {
            background: transparent;
            border: 1px solid transparent;
            color: var(--text-muted);
            font-size: 1rem;
            font-weight: 600;
            padding: 0.5rem 1.2rem;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .nav-btn:hover, .nav-btn.active {
            color: #fff;
            background: rgba(138, 43, 226, 0.15);
            border-color: var(--accent-purple);
            box-shadow: 0 0 15px rgba(138, 43, 226, 0.3);
        }

        main {
            padding: 2.5rem 3rem;
            max-width: 1600px;
            margin: 0 auto;
        }

        .view {
            display: none;
        }

        .view.active {
            display: block;
            animation: fadeIn 0.4s ease forwards;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .hero-banner {
            text-align: center;
            padding: 4rem 1rem;
            background: radial-gradient(circle at center, rgba(138,43,226,0.15) 0%, transparent 70%);
            border-radius: 20px;
            margin-bottom: 3rem;
            border: 1px solid var(--border-color);
        }

        .hero-banner h1 {
            font-size: 3rem;
            margin-bottom: 1rem;
            color: #fff;
            text-shadow: 0 0 30px var(--primary-glow);
        }

        .hero-banner p {
            color: var(--text-muted);
            font-size: 1.1rem;
        }

        .section-title {
            font-size: 1.5rem;
            margin-bottom: 1.5rem;
            font-weight: 700;
            letter-spacing: 1px;
            border-left: 4px solid var(--accent-purple);
            padding-left: 0.75rem;
        }

        .apps-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
            gap: 1.5rem;
            margin-bottom: 3rem;
        }

        .app-card {
            background: var(--panel-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 1.5rem;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            backdrop-filter: blur(10px);
        }

        .app-card:hover {
            transform: translateY(-5px);
            border-color: var(--accent-pink);
            box-shadow: 0 10px 25px rgba(255, 0, 127, 0.25);
        }

        .app-card img {
            width: 48px;
            height: 48px;
            margin-bottom: 1rem;
        }

        .app-card h3 {
            font-size: 1.1rem;
            color: #fff;
        }

        .search-bar {
            width: 100%;
            padding: 1rem 1.5rem;
            background: var(--panel-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            color: #fff;
            font-size: 1.1rem;
            margin-bottom: 2rem;
            outline: none;
            transition: all 0.3s ease;
        }

        .search-bar:focus {
            border-color: var(--accent-purple);
            box-shadow: 0 0 20px rgba(138, 43, 226, 0.3);
        }

        .games-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 1.5rem;
        }

        .game-card {
            background: var(--panel-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            overflow: hidden;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            flex-direction: column;
        }

        .game-card:hover {
            transform: translateY(-5px);
            border-color: var(--accent-purple);
            box-shadow: 0 10px 30px rgba(138, 43, 226, 0.3);
        }

        .game-thumb {
            width: 100%;
            height: 130px;
            background: #111;
            object-fit: cover;
            border-bottom: 1px solid var(--border-color);
        }

        .game-info {
            padding: 1rem;
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .game-title {
            font-size: 1rem;
            font-weight: 600;
            color: #fff;
            margin-bottom: 0.5rem;
            word-break: break-all;
        }

        .play-badge {
            font-size: 0.8rem;
            color: var(--accent-pink);
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        /* Interactive Game Modal Player */
        #game-modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(0, 0, 0, 0.95);
            backdrop-filter: blur(15px);
            z-index: 1000;
            display: none;
            flex-direction: column;
            padding: 2rem;
        }

        #game-modal.open {
            display: flex;
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1rem;
        }

        .modal-title {
            font-size: 1.4rem;
            font-weight: 700;
            color: #fff;
        }

        .close-btn {
            background: rgba(255, 255, 255, 0.1);
            border: none;
            color: #fff;
            padding: 0.5rem 1rem;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            transition: background 0.2s;
        }

        .close-btn:hover {
            background: var(--accent-pink);
        }

        .modal-body {
            flex-grow: 1;
            background: #000;
            border-radius: 12px;
            border: 1px solid var(--border-color);
            overflow: hidden;
            position: relative;
        }

        .modal-body iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
    </style>
</head>
<body>

    <canvas id="particle-canvas"></canvas>

    <header>
        <div class="logo" onclick="switchView('home')">HALLOW</div>
        <nav>
            <button class="nav-btn active" onclick="switchView('home')">Home</button>
            <button class="nav-btn" onclick="switchView('games')">Games</button>
            <button class="nav-btn" onclick="switchView('sites')">Sites</button>
        </nav>
    </header>

    <main>
        <!-- HOME VIEW -->
        <div id="home-view" class="view active">
            <div class="hero-banner">
                <h1>Welcome to Hallow</h1>
                <p>Your immersive black-themed arcade and web app dashboard.</p>
            </div>

            <div class="section-title">Quick Apps</div>
            <div class="apps-grid">
                <div class="app-card" onclick="openExternalApp('https://www.youtube.com')">
                    <img src="https://www.svgrepo.com/show/13671/youtube.svg" alt="YouTube">
                    <h3>YouTube</h3>
                </div>
                <div class="app-card" onclick="openExternalApp('https://discord.com/app')">
                    <img src="https://www.svgrepo.com/show/353655/discord-icon.svg" alt="Discord">
                    <h3>Discord</h3>
                </div>
                <div class="app-card" onclick="openExternalApp('https://www.twitch.tv')">
                    <img src="https://www.svgrepo.com/show/452203/twitch.svg" alt="Twitch">
                    <h3>Twitch</h3>
                </div>
                <div class="app-card" onclick="openExternalApp('https://www.reddit.com')">
                    <img src="https://www.svgrepo.com/show/521666/reddit.svg" alt="Reddit">
                    <h3>Reddit</h3>
                </div>
                <div class="app-card" onclick="openExternalApp('https://open.spotify.com')">
                    <img src="https://www.svgrepo.com/show/512317/spotify-165.svg" alt="Spotify">
                    <h3>Spotify</h3>
                </div>
                <div class="app-card" onclick="openExternalApp('https://github.com')">
                    <img src="https://www.svgrepo.com/show/512317/github-142.svg" alt="GitHub">
                    <h3>GitHub</h3>
                </div>
            </div>
        </div>

        <!-- GAMES VIEW -->
        <div id="games-view" class="view">
            <input type="text" id="game-search" class="search-bar" placeholder="Search games alphabetically..." oninput="filterGames()">
            <div id="games-grid" class="games-grid"></div>
        </div>

        <!-- SITES VIEW -->
        <div id="sites-view"
